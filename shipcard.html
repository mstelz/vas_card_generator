<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${ship_name}</title>
    <base href="file:///${base_dir}/" />
    <style>
        body {
            font-family: Arial, "DejaVu Sans", sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #d3cabd;
        }

        .container {
            width: 90%;
            margin: 0 auto;
            padding: 110px 10px 20px 10px;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            margin-bottom: 0px;
        }

        .title {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            max-width: 1300px;
        }

        .title .flag {
            height: 45px;
            flex-shrink: 0;
        }

        .title h1 {
            text-align: left;
            font-size: 34px;
            margin: 0;
            color: #333;
            letter-spacing: 1px;
            line-height: 1.15;
            word-wrap: break-word;
        }

        .points-container {
            font-size: 18px;
            font-weight: bold;
            padding: 5px;
            border: 3px dotted #571314;
            border-radius: 50%;
            text-align: center;
            width: 75px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #571314;
            flex-shrink: 0;
            margin-left: 20px;
        }

        .points {
            font-size: 28px;
            line-height: 1;
        }

        .ship-slot {
            height: 170px;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            margin-bottom: 14px;
        }

        .ship-image {
            max-height: 170px;
            max-width: 85%;
            object-fit: contain;
            object-position: right bottom;
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 0 16px 0;
        }

        th,
        td {
            border: 2px dotted #571314;
            padding: 8px 10px;
            text-align: center;
            font-size: 22px;
        }

        th {
            font-weight: bold;
        }

        td {
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Ship Header -->
        <div class="top-bar">
            <div class="title">
                ${nation_html} <!-- Dynamically insert the nation flag image -->
                <h1>${ship_name}</h1>
            </div>

            <div class="points-container">
                <span class="points">${points}</span>
                <span>points</span>
            </div>
        </div>

        <!-- Ship Silhouette Area (Waterline resting on stats table) -->
        <div class="ship-slot">
            ${ship_image_html} <!-- Dynamically insert the ship image -->
        </div>

        <!-- Ship Details Table -->
        <table>
            <tr>
                <th>Type</th>
                <th>Flank Speed</th>
                <th>Armour</th>
                <th>Hull</th>
                <th>Traits</th>
            </tr>
            <tr>
                <td>${ship_type}</td>
                <td>${flank_speed}</td>
                <td>${armour}</td>
                <td>${hull}</td>
                <td>${traits}</td>
            </tr>
        </table>

        <!-- Weapon Systems Table -->
        <table>
            <tr>
                <th>Weapon System</th>
                <th>Fire Arc</th>
                <th>Point Blank</th>
                <th>Short</th>
                <th>Long</th>
                <th>Extreme</th>
                <th>AD</th>
                <th>AP</th>
                <th>DD</th>
                <th>Traits</th>
            </tr>
            ${weapon_rows}
        </table>
    </div>
</body>

</html>
